<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>فروشگاه</title>
<meta name="description" content="فروشگاه اینترنتی">
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#202124;--muted:#6b7280;--line:#e5e7eb;--primary:#ef4056;--primary2:#d92d45;--green:#16a34a;--shadow:0 4px 18px rgba(0,0,0,.06);--radius:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
a{color:inherit;text-decoration:none}.wrap{max-width:1280px;margin:auto;padding:0 18px}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}.toprow{height:74px;display:flex;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:900;white-space:nowrap}.brand img{width:42px;height:42px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}
.search{flex:1;position:relative}.search input{width:100%;height:48px;border:0;background:#f1f2f4;border-radius:13px;padding:0 48px 0 18px;outline:none}.search svg{position:absolute;right:17px;top:14px;width:20px;height:20px;color:#777}.actions{display:flex;align-items:center;gap:8px}.iconbtn{border:1px solid var(--line);background:#fff;border-radius:12px;height:44px;min-width:44px;display:grid;place-items:center;position:relative}.badge{position:absolute;top:-5px;left:-5px;background:var(--primary);color:#fff;border-radius:20px;min-width:19px;height:19px;font-size:11px;display:grid;place-items:center;padding:0 4px}
.nav{background:#fff;border-bottom:1px solid var(--line)}.navrow{display:flex;gap:22px;overflow:auto;height:45px;align-items:center;white-space:nowrap}.nav a{font-size:14px;color:#555}.nav a:hover{color:var(--primary)}
.hero{margin:22px 0;background:linear-gradient(135deg,#fff,#fcecef);border:1px solid #f3d5db;border-radius:22px;min-height:220px;display:grid;grid-template-columns:1.3fr .7fr;overflow:hidden}.heroText{padding:36px}.hero h1{margin:0 0 12px;font-size:32px}.hero p{color:var(--muted);line-height:2;margin:0 0 22px}.cta{border:0;background:var(--primary);color:#fff;padding:12px 22px;border-radius:12px;font-weight:800}.heroArt{display:grid;place-items:center;font-size:100px}
.section{margin:28px 0}.sectionHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.sectionHead h2{font-size:21px;margin:0}.sectionHead span{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:10px;overflow:auto;padding-bottom:4px}.chip{background:#fff;border:1px solid var(--line);border-radius:30px;padding:10px 18px;white-space:nowrap}.chip.active{border-color:var(--primary);color:var(--primary);background:#fff5f6}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow);transition:.18s}.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.09)}.pic{aspect-ratio:1/1;background:#f7f7f8;position:relative}.pic img{width:100%;height:100%;object-fit:cover;display:block}.stock{position:absolute;right:10px;top:10px;background:#fff;border-radius:9px;padding:5px 8px;font-size:11px;box-shadow:0 2px 8px #0001}.stock.out{color:#dc2626}.body{padding:13px}.name{font-size:14px;font-weight:750;line-height:1.8;min-height:51px}.cat{color:var(--muted);font-size:11px;margin:4px 0 10px}.price{font-size:17px;font-weight:900;direction:ltr;text-align:right}.price small{font-size:10px;color:var(--muted);margin-right:4px}.cardbtn{width:100%;margin-top:12px;height:42px;border-radius:11px;border:1px solid #f1a4ae;background:#fff6f7;color:var(--primary);font-weight:800}.cardbtn:hover{background:var(--primary);color:#fff}.cardbtn:disabled{opacity:.45;cursor:not-allowed}
.toolbar{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;margin-bottom:18px}.toolbar select{height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 12px}.count{color:var(--muted);font-size:13px}
.detail{background:#fff;border:1px solid var(--line);border-radius:20px;margin:24px 0;padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:34px}.gallery{display:grid;grid-template-columns:86px 1fr;gap:12px}.thumbs{display:flex;flex-direction:column;gap:9px}.thumb{width:82px;height:82px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fafafa;padding:0}.thumb.active{border:2px solid var(--primary)}.thumb img{width:100%;height:100%;object-fit:cover}.mainpic{aspect-ratio:1/1;background:#fafafa;border-radius:16px;overflow:hidden}.mainpic img{width:100%;height:100%;object-fit:contain}.detail h1{font-size:27px;line-height:1.7;margin:0 0 10px}.desc{color:#555;line-height:2;white-space:pre-line}.divider{height:1px;background:var(--line);margin:18px 0}.variants{display:flex;flex-wrap:wrap;gap:10px}.variant{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 13px;display:flex;gap:7px;align-items:center}.variant.selected{border-color:var(--primary);box-shadow:0 0 0 2px #ef405620}.variant:disabled{opacity:.4}.dot{width:17px;height:17px;border-radius:50%;border:1px solid #aaa}.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;width:max-content;overflow:hidden}.qty button{width:40px;height:42px;border:0;background:#f7f7f8}.qty span{min-width:44px;text-align:center}.buyrow{display:flex;gap:12px;align-items:center;margin-top:20px}.buy{flex:1;height:46px;background:var(--primary);border:0;border-radius:12px;color:#fff;font-weight:900}.buy:disabled{opacity:.4}.back{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 15px}
.cartLayout{display:grid;grid-template-columns:1fr 340px;gap:18px;margin:24px 0}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px}.cartItem{display:grid;grid-template-columns:88px 1fr auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}.cartItem:last-child{border-bottom:0}.cartItem img{width:88px;height:88px;object-fit:cover;border-radius:12px;background:#f5f5f5}.miniName{font-weight:800}.muted{color:var(--muted);font-size:13px}.remove{border:0;background:none;color:#dc2626}.summaryRow{display:flex;justify-content:space-between;margin:12px 0}.total{font-size:20px;font-weight:900}.checkout{width:100%;height:46px;background:var(--primary);color:#fff;border:0;border-radius:12px;font-weight:900;margin-top:14px}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:13px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;outline:none;background:#fff}.field textarea{min-height:110px;resize:vertical}.field.full{grid-column:1/-1}.paybox{border:1px dashed #f0a4ae;background:#fff6f7;border-radius:14px;padding:14px;line-height:1.9}
.success{text-align:center;padding:50px 20px}.success .mark{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:#dcfce7;color:#15803d;font-size:36px;margin:0 auto 15px}
.empty{text-align:center;padding:55px 20px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:18px}.loading{padding:50px;text-align:center;color:var(--muted)}
footer{margin-top:50px;background:#202124;color:#ddd;padding:40px 0}.footergrid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:30px}.footerTitle{color:#fff;font-weight:900;margin-bottom:10px}.footerText{line-height:2;color:#bbb;font-size:13px}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{grid-template-columns:1fr}.heroArt{display:none}.detail{grid-template-columns:1fr}.cartLayout{grid-template-columns:1fr}.footergrid{grid-template-columns:1fr 1fr}.toprow{height:auto;padding:12px 0;flex-wrap:wrap}.brand{order:1}.actions{order:2;margin-right:auto}.search{order:3;flex-basis:100%}}
@media(max-width:600px){.wrap{padding:0 11px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.hero{margin:12px 0;min-height:180px}.heroText{padding:24px}.hero h1{font-size:24px}.section{margin:20px 0}.detail{padding:12px;gap:18px}.gallery{grid-template-columns:62px 1fr}.thumb{width:60px;height:60px}.detail h1{font-size:21px}.formGrid{grid-template-columns:1fr}.field.full{grid-column:auto}.cartItem{grid-template-columns:70px 1fr}.cartItem img{width:70px;height:70px}.cartItem .qty{grid-column:2}.footergrid{grid-template-columns:1fr}.navrow{gap:15px}.name{font-size:13px}.price{font-size:15px}}
</style>
</head>
<body>
<header class="top"><div class="wrap toprow">
<a class="brand" href="index.html"><img id="logo" alt="لوگو"><span id="brandName">فروشگاه</span></a>
<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" placeholder="جستجوی محصول، دسته‌بندی یا نام محصول…" oninput="searchProducts(this.value)"></div>
<div class="actions"><a class="iconbtn" href="admin.html" title="مدیریت">⚙</a><button class="iconbtn" onclick="go('cart')" title="سبد خرید">🛒<span class="badge" id="cartCount">0</span></button></div>
</div></header>
<nav class="nav"><div class="wrap navrow"><a href="index.html">خانه</a><a href="#products">همه محصولات</a><span id="categoryNav"></span></div></nav>
<main class="wrap" id="app"><div class="loading">در حال بارگذاری فروشگاه…</div></main>
<footer><div class="wrap footergrid"><div><div class="footerTitle" id="footerName">فروشگاه</div><div class="footerText">نسخه آزمایشی فروشگاه — اطلاعات محصولات از کاتالوگ مرکزی خوانده می‌شود.</div></div><div><div class="footerTitle">خرید</div><div class="footerText">محصولات<br>سبد خرید<br>پیگیری سفارش</div></div><div><div class="footerTitle">مدیریت</div><div class="footerText"><a href="admin.html">ورود به پنل مدیریت</a></div></div></div></footer>
<script>
const DATA_URL='data.json';
const RAW_BASE='https://raw.githubusercontent.com/Hesamusa/pricing-app/main/';
let state={products:[],settings:{},categories:[],view:'home',selected:null,selectedColor:null,qty:1,cart:[],orders:[],search:'',category:'all'};
const fa=new Intl.NumberFormat('fa-IR');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function money(n){return fa.format(Math.round(Number(n)||0))+' تومان'}
function imgUrl(p){const im=p?.images?.[0];if(!im)return '';return im.url||((im.path)?RAW_BASE+im.path:'')}
function allStock(p){if(Array.isArray(p.colors)&&p.colors.length&&p.colorStock)return p.colors.reduce((a,c)=>a+(Number(p.colorStock[c.id])||0),0);return Number(p.stock)||0}
function calc(p){const s=state.settings||{};const filament=(Number(p.weight)||0)/1000*(Number(s.filPrice)||0);const elec=(Number(p.printHours)||0)*(Number(s.power)||0)/1000*(Number(s.elec)||0);const depr=(Number(p.printHours)||0)*(Number(s.depr)||0);const labor=(Number(p.manualHours)||0)*(Number(s.labor)||0);const paint=(Number(p.paintHours)||0)*(Number(s.paint)||0);const acc=Number(p.accessoryCost)||0;const total=filament+elec+depr+labor+paint+acc;const mw=((p.marginW??s.marginW??0)/100),mr=((p.marginR??s.marginR??0)/100);const step=Number(s.roundStep)||1;return {priceW:Math.round(total*(1+mw)/step)*step,priceR:Math.round(total*(1+mr)/step)*step}}
function price(p){return calc(p).priceR}
function save(){localStorage.setItem('storefront_cart',JSON.stringify(state.cart));localStorage.setItem('storefront_orders',JSON.stringify(state.orders))}
function loadLocal(){try{state.cart=JSON.parse(localStorage.getItem('storefront_cart')||'[]')}catch{}try{state.orders=JSON.parse(localStorage.getItem('storefront_orders')||'[]')}catch{}}
async function load(){loadLocal();let d=null;try{let r=await fetch(DATA_URL+'?v='+Date.now(),{cache:'no-store'});if(r.ok)d=await r.json()}catch{}if(!d){try{let r=await fetch(RAW_BASE+'data.json?v='+Date.now(),{cache:'no-store'});if(r.ok)d=await r.json()}catch{}}
if(!d||!Array.isArray(d.products))throw new Error('داده محصولات پیدا نشد');state.products=d.products;state.settings=d.settings||{};state.categories=state.settings.productGroups||[];document.title=state.settings.companyName||'فروشگاه';document.getElementById('brandName').textContent=state.settings.companyName||'فروشگاه';document.getElementById('footerName').textContent=state.settings.companyName||'فروشگاه';const logo=document.getElementById('logo');logo.src=state.settings.logoUrl||RAW_BASE+'product-images/brand-logo.png';renderNav();render();updateCart()}
function renderNav(){document.getElementById('categoryNav').innerHTML=state.categories.map(c=>`<a href="#products" onclick="setCat('${esc(c.id)}');return false">${esc(c.name)}</a>`).join('')}
function setCat(c){state.category=c;state.view='home';render()}
function searchProducts(v){state.search=v.trim();if(state.view==='detail'||state.view==='cart'||state.view==='checkout')state.view='home';render()}
function filtered(){let a=state.products.filter(p=>allStock(p)>0);if(state.category!=='all')a=a.filter(p=>p.category===state.category);const q=state.search.replace(/ي/g,'ی').replace(/ك/g,'ک').toLowerCase();if(q)a=a.filter(p=>(p.name||'').replace(/ي/g,'ی').replace(/ك/g,'ک').toLowerCase().includes(q));return a}
function card(p){const st=allStock(p),c=state.categories.find(x=>x.id===p.category);return `<article class="card"><a href="?product=${encodeURIComponent(p.id)}"><div class="pic">${imgUrl(p)?`<img src="${esc(imgUrl(p))}" loading="lazy" alt="${esc(p.name)}">`:'<div style="display:grid;place-items:center;height:100%;font-size:45px">🛍️</div>'}<span class="stock ${st<=0?'out':''}">${st>0?'موجود':'ناموجود'}</span></div><div class="body"><div class="name">${esc(p.name)}</div><div class="cat">${esc(c?.name||'محصول')}</div><div class="price">${money(price(p))}</div><button class="cardbtn" ${st<=0?'disabled':''} onclick="event.preventDefault();event.stopPropagation();quickAdd('${esc(p.id)}')">افزودن به سبد</button></div></a></article>`}
function renderHome(){const list=filtered();return `<section class="hero"><div class="heroText"><h1>فروشگاه ${esc(state.settings.companyName||'ما')}</h1><p>محصولات را ببین، رنگ موردنظرت را انتخاب کن و خرید آزمایشی را تا آخرین مرحله انجام بده.</p><button class="cta" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">مشاهده محصولات</button></div><div class="heroArt">🛍️</div></section><section class="section"><div class="sectionHead"><h2>دسته‌بندی‌ها</h2><span>انتخاب کن و محصولات را ببین</span></div><div class="chips"><button class="chip ${state.category==='all'?'active':''}" onclick="setCat('all')">همه</button>${state.categories.map(c=>`<button class="chip ${state.category===c.id?'active':''}" onclick="setCat('${esc(c.id)}')">${esc(c.name)}</button>`).join('')}</div></section><section class="section" id="products"><div class="sectionHead"><h2>${state.search?`نتایج جستجو برای «${esc(state.search)}»`:'محصولات'}</h2><span>${fa.format(list.length)} محصول</span></div>${list.length?`<div class="grid">${list.map(card).join('')}</div>`:'<div class="empty">محصولی با این مشخصات پیدا نشد.</div>'}</section>`}
function renderDetail(id){const p=state.products.find(x=>x.id===id);if(!p){state.view='home';return renderHome()}const colors=Array.isArray(p.colors)?p.colors:[];let color=state.selectedColor&&colors.find(x=>x.id===state.selectedColor);if(!color)color=colors.find(x=>(Number(p.colorStock?.[x.id])||0)>0)||colors[0];const stock=color?(Number(p.colorStock?.[color.id])||0):allStock(p);const images=(p.images||[]).map(x=>x.url||RAW_BASE+x.path).filter(Boolean);const main=images[0]||'';return `<div style="margin:20px 0"><button class="back" onclick="go('home')">→ بازگشت به فروشگاه</button></div><section class="detail"><div class="gallery"><div class="thumbs">${images.map((u,i)=>`<button class="thumb ${i===0?'active':''}" onclick="this.closest('.gallery').querySelector('.mainpic img').src='${esc(u)}';this.parentElement.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));this.classList.add('active')"><img src="${esc(u)}" alt=""></button>`).join('')}</div><div class="mainpic">${main?`<img src="${esc(main)}" alt="${esc(p.name)}">`:'🛍️'}</div></div><div><div class="cat">${esc((state.categories.find(x=>x.id===p.category)||{}).name||'محصول')}</div><h1>${esc(p.name)}</h1><div class="desc">${esc(p.catalogDescription||'توضیحات محصول')}</div><div class="divider"></div>${colors.length?`<h3>انتخاب رنگ</h3><div class="variants">${colors.map(c=>{const n=Number(p.colorStock?.[c.id])||0;return `<button class="variant ${color?.id===c.id?'selected':''}" ${n<=0?'disabled':''} onclick="chooseColor('${esc(p.id)}','${esc(c.id)}')"><span class="dot" style="background:${esc(c.hex||'#ddd')}"></span>${esc(c.name)} <small>${n?fa.format(n)+' عدد':'ناموجود'}</small></button>`}).join('')}</div>`:''}<div class="divider"></div><div class="price" style="font-size:24px">${money(price(p))}</div><div class="muted" style="margin-top:5px">${stock>0?`موجودی: ${fa.format(stock)} عدد`:'ناموجود'}</div><div class="buyrow"><div class="qty"><button onclick="changeQty(-1)">−</button><span id="qty">${fa.format(state.qty)}</span><button onclick="changeQty(1)">+</button></div><button class="buy" ${stock<=0?'disabled':''} onclick="addToCart('${esc(p.id)}')">افزودن به سبد خرید</button></div></div></section>`}
function chooseColor(pid,cid){state.selectedColor=cid;state.qty=1;history.replaceState({},'',`?product=${encodeURIComponent(pid)}&color=${encodeURIComponent(cid)}`);render()}
function changeQty(d){const p=state.products.find(x=>x.id===state.selected);const c=p?.colors?.find(x=>x.id===state.selectedColor);const max=c?(Number(p.colorStock?.[c.id])||0):allStock(p||{});state.qty=Math.max(1,Math.min(max||1,state.qty+d));document.getElementById('qty').textContent=fa.format(state.qty)}
function addToCart(pid,quick=false){const p=state.products.find(x=>x.id===pid);if(!p)return;let color=state.selectedColor;if(!color&&p.colors?.length)color=p.colors.find(c=>(Number(p.colorStock?.[c.id])||0)>0)?.id||p.colors[0].id;const available=color?(Number(p.colorStock?.[color])||0):allStock(p);const qty=quick?1:state.qty;if(available<qty)return alert('موجودی کافی نیست.');const key=pid+'__'+(color||'');const old=state.cart.find(x=>x.key===key);if(old)old.qty=Math.min(available,old.qty+qty);else state.cart.push({key,pid,color,qty});save();updateCart();if(quick)alert('محصول به سبد خرید اضافه شد.');else go('cart')}
function quickAdd(pid){state.selected=pid;state.selectedColor=null;state.qty=1;addToCart(pid,true)}
function cartItems(){return state.cart.map(i=>{const p=state.products.find(x=>x.id===i.pid);if(!p)return null;const c=p.colors?.find(x=>x.id===i.color);return {...i,p,c,unit:price(p)}}).filter(Boolean)}
function updateCart(){document.getElementById('cartCount').textContent=fa.format(state.cart.reduce((a,x)=>a+x.qty,0))}
function renderCart(){
  const items=cartItems();
  const total=items.reduce((a,x)=>a+x.unit*x.qty,0);
  let rows='';
  for(const x of items){
    rows += '<div class="cartItem"><img src="'+esc(imgUrl(x.p))+'" alt=""><div><div class="miniName">'+esc(x.p.name)+'</div><div class="muted">'+(x.c?'رنگ: '+esc(x.c.name):'')+'</div><div style="margin-top:8px">'+money(x.unit)+'</div></div><div><button class="remove" onclick="removeCart(\''+esc(x.key)+'\')">حذف</button><div class="qty" style="margin-top:12px"><button onclick="cartQty(\''+esc(x.key)+'\',-1)">−</button><span>'+fa.format(x.qty)+'</span><button onclick="cartQty(\''+esc(x.key)+'\',1)">+</button></div></div></div>';
  }
  const body=items.length ? '<div class="cartLayout"><div class="panel">'+rows+'</div><aside class="panel"><h3>خلاصه سفارش</h3><div class="summaryRow"><span>جمع کالاها</span><b>'+money(total)+'</b></div><div class="summaryRow"><span>هزینه ارسال</span><span>در تست محاسبه می‌شود</span></div><div class="divider"></div><div class="summaryRow total"><span>مبلغ کالاها</span><span>'+money(total)+'</span></div><button class="checkout" onclick="go(\'checkout\')">ادامه و ثبت سفارش</button></aside></div>' : '<div class="empty">سبد خرید خالی است.<br><br><button class="cta" onclick="go(\'home\')">رفتن به فروشگاه</button></div>';
  return '<section class="section"><div class="sectionHead"><h2>سبد خرید</h2><span>'+fa.format(items.reduce((a,x)=>a+x.qty,0))+' کالا</span></div>'+body+'</section>';
}

function cartQty(key,d){const x=state.cart.find(i=>i.key===key);if(!x)return;const p=state.products.find(p=>p.id===x.pid);const av=x.color?(Number(p.colorStock?.[x.color])||0):allStock(p);x.qty=Math.max(1,Math.min(av,x.qty+d));save();updateCart();render()}
function removeCart(key){state.cart=state.cart.filter(x=>x.key!==key);save();updateCart();render()}
function renderCheckout(){const items=cartItems(),total=items.reduce((a,x)=>a+x.unit*x.qty,0);if(!items.length){state.view='cart';return renderCart()}return `<section class="section"><div class="sectionHead"><h2>ثبت سفارش آزمایشی</h2><span>مرحله ۱ از ۲</span></div><div class="cartLayout"><form class="panel" onsubmit="submitOrder(event)"><div class="formGrid"><div class="field"><label>نام و نام خانوادگی *</label><input required name="name"></div><div class="field"><label>شماره موبایل *</label><input required name="phone" inputmode="tel"></div><div class="field"><label>استان *</label><input required name="province"></div><div class="field"><label>شهر *</label><input required name="city"></div><div class="field full"><label>آدرس *</label><textarea required name="address"></textarea></div><div class="field"><label>کد پستی</label><input name="postal" inputmode="numeric"></div><div class="field"><label>روش ارسال</label><select name="shipping"><option>ارسال عادی</option><option>ارسال سریع</option></select></div></div><div class="divider"></div><div class="paybox"><b>پرداخت آزمایشی</b><br>این مرحله واقعی نیست و هیچ مبلغی از حساب شما کسر نمی‌شود. با ثبت سفارش، سفارش آزمایشی ایجاد و موجودی محلی کاهش داده می‌شود.</div><button class="checkout">تأیید و پرداخت آزمایشی</button></form><aside class="panel"><h3>خلاصه سفارش</h3>${items.map(x=>`<div class="summaryRow"><span>${esc(x.p.name)} × ${fa.format(x.qty)}</span><b>${money(x.unit*x.qty)}</b></div>`).join('')}<div class="divider"></div><div class="summaryRow total"><span>جمع</span><span>${money(total)}</span></div></aside></div></section>`}
function submitOrder(e){e.preventDefault();const fd=new FormData(e.target),items=cartItems();for(const x of items){const av=x.color?(Number(x.p.colorStock?.[x.color])||0):allStock(x.p);if(av<x.qty)return alert('موجودی یکی از محصولات کافی نیست؛ سبد خرید را بررسی کنید.')}const order={id:'TEST-'+Date.now().toString(36).toUpperCase(),date:new Date().toISOString(),customer:{name:fd.get('name'),phone:fd.get('phone'),province:fd.get('province'),city:fd.get('city'),address:fd.get('address'),postal:fd.get('postal')},shipping:fd.get('shipping'),status:'پرداخت آزمایشی موفق',items:items.map(x=>({productId:x.pid,productName:x.p.name,colorId:x.color||null,colorName:x.c?.name||null,qty:x.qty,unitPrice:x.unit,total:x.unit*x.qty}))};state.orders.unshift(order);
  for(const x of items){
    const p=state.products.find(pp=>pp.id===x.pid);
    if(!p) continue;
    if(x.color && p.colorStock){ p.colorStock[x.color]=Math.max(0,(Number(p.colorStock[x.color])||0)-x.qty); p.stock=Object.values(p.colorStock).reduce((a,v)=>a+(Number(v)||0),0); }
    else { p.stock=Math.max(0,(Number(p.stock)||0)-x.qty); }
  }
  try{localStorage.setItem('pricing_app_products',JSON.stringify(state.products));}catch(e){}
  state.cart=[];save();updateCart();state.view='success';state.lastOrder=order;render()}
function renderSuccess(){const o=state.lastOrder||state.orders[0];return `<section class="panel success" style="margin:30px 0"><div class="mark">✓</div><h2>سفارش آزمایشی ثبت شد</h2><p>شماره سفارش: <b>${esc(o?.id||'')}</b></p><p class="muted">در نسخه نهایی همین مرحله به درگاه واقعی و سیستم سفارش مرکزی متصل می‌شود.</p><button class="cta" onclick="go('home')">بازگشت به فروشگاه</button></section>`}
function render(){const q=new URLSearchParams(location.search);const pid=q.get('product');if(pid){state.view='detail';state.selected=pid;if(q.get('color'))state.selectedColor=q.get('color')}const root=document.getElementById('app');if(state.view==='home')root.innerHTML=renderHome();else if(state.view==='detail')root.innerHTML=renderDetail(state.selected);else if(state.view==='cart')root.innerHTML=renderCart();else if(state.view==='checkout')root.innerHTML=renderCheckout();else if(state.view==='success')root.innerHTML=renderSuccess();window.scrollTo({top:0,behavior:'instant'})}
function go(v){if(v==='home'){history.pushState({},'',location.pathname);state.view='home';state.selected=null}else{history.pushState({},'',location.pathname+(v==='cart'?'?page=cart':v==='checkout'?'?page=checkout':''));state.view=v}render()}
window.onpopstate=()=>{const q=new URLSearchParams(location.search);if(q.get('product')){state.selected=q.get('product');state.view='detail'}else if(q.get('page')==='cart')state.view='cart';else if(q.get('page')==='checkout')state.view='checkout';else state.view='home';render()};
load().catch(e=>{document.getElementById('app').innerHTML='<div class="empty">بارگذاری محصولات انجام نشد.<br><small>'+esc(e.message)+'</small><br><br>مطمئن شوید فایل <b>data.json</b> کنار index.html قرار دارد.</div>'});
</script>
</body></html>
